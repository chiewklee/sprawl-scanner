http.port=8081

# Anypoint (Exchange + API Manager). clientId/clientSecret are Secured Application Properties.
anypoint.baseUrl=https://anypoint.mulesoft.com
anypoint.orgId=fa76c43c-f6d0-41fd-bdcd-214ccae74d41

# Gemini. apiKey is a Secured Application Property.
gemini.embedModel=gemini-embedding-001
gemini.judgeModel=gemini-3.8-flash
# Judge pacing in requests/minute (0 = unpaced). Pro preview has a low per-minute quota.
gemini.proRpm=20
gemini.flashRpm=0

# Similarity thresholds, calibrated for gemini-embedding-001 (recalibrate if the model changes).
thresholds.redundant=0.91
thresholds.gray=0.88

# Governed routes that win consolidation ties and are never recommended for retirement (comma-separated).
scan.preferredAssets=
scan.workers=8
scan.judgeLimit=400
scan.historySize=50

# Nightly scan (02:00 UTC). Set scan.schedule.enabled=false to turn off.
scan.schedule.enabled=true
scan.schedule.cron=0 0 2 * * ?

# Auth for reading tools/list from MCP servers whose upstream needs a token (OAuth client credentials).
# Salesforce platform MCP (api.salesforce.com) needs a Salesforce JWT. clientId/clientSecret are
# Secured Application Properties: mcpAuth.salesforce.clientId, mcpAuth.salesforce.clientSecret.
mcpAuth.salesforce.hosts=api.salesforce.com
# Your Salesforce My Domain token endpoint (override per deployment in Runtime Manager properties).
mcpAuth.salesforce.tokenUrl=https://YOUR-DOMAIN.my.salesforce.com/services/oauth2/token
