[project]
name = "sprawl-scanner"
version = "0.1.0"
description = "Find redundancy and overlap across agents, MCP servers and APIs: unique, redundant and gray-area capabilities."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sprawl-scan = "sprawl_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sprawl_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
